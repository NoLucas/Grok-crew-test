name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build GrokCrew-Windows.exe
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Build the desktop renderer
        run: npm run build
      - name: Build Local Studio sidecar
        run: |
          python -m pip install -r local_studio/requirements-build.txt
          python -m PyInstaller --clean --distpath build/sidecar --workpath build/pyinstaller local_studio/grok_crew_sidecar.spec
      - name: Pack the bot zip
        run: npm run dist:bot-pack
      - name: Build the unsigned Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --publish never
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Grok Crew ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.v1.0.md
          files: |
            release/GrokCrew-Windows.exe
            release/GrokCrew-Windows.exe.blockmap
            release/latest.yml
            release/GrokCrew-bot-pack.zip
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
